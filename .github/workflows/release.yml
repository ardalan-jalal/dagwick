name: Release
# Publishing a GitHub release uploads the package to PyPI. PyPI trusted
# publishing authorizes this workflow, so no token is stored in the repository.
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PyPI trusts only this environment (see RELEASING.md). Its protection rules
    # (required reviewers, tags vX.Y.Z only) mean one write-access account cannot
    # publish an arbitrary commit on its own.
    environment:
      name: pypi
      url: https://pypi.org/project/dagwick/
    # Job permissions replace the defaults, so checkout needs contents: read again.
    permissions:
      contents: read
      id-token: write # PyPI Trusted Publishing, Sigstore and the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the next step needs main's history
      - name: The release commit is on main
        # main only takes reviewed pull requests, so this ties the upload to reviewed code.
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "$GITHUB_REF_NAME ($GITHUB_SHA) is not on main. Release only from main."
            exit 1
          }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: The release tag matches the package version
        run: |
          version=$(grep -Po '(?<=__version__ = ")[^"]+' src/dagwick/__init__.py)
          test "${GITHUB_REF_NAME#v}" = "$version" || {
            echo "Tag $GITHUB_REF_NAME does not match version $version in src/dagwick/__init__.py"
            exit 1
          }
      - name: The changelog has dated notes for this version
        run: python3 scripts/release_notes.py "$GITHUB_REF_NAME"
      - name: PyPI accepts every classifier
        run: |
          uvx --with trove-classifiers==2026.9.21.13 python -c '
          import sys, tomllib
          from trove_classifiers import classifiers
          bad = [c for c in tomllib.load(open("pyproject.toml", "rb"))["project"]["classifiers"] if c not in classifiers]
          sys.exit(f"Unknown classifiers: {bad}" if bad else 0)'
      - run: uv build
      # Provenance: a signed statement that this workflow built these files from
      # this commit. Verify with: gh attestation verify <file> -R ardalan-jalal/dagwick
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: dist/*
      # Sigstore signatures for the GitHub release. They are made on a copy, because
      # PyPI only accepts the wheel and sdist in dist/.
      - name: Copy the release files to sign
        run: mkdir release-assets && cp dist/* release-assets/
      # The provenance also goes on the GitHub release as a file, where OpenSSF
      # Scorecard (Signed-Releases) looks for it: *.intoto.jsonl.
      # Verify with: gh attestation verify <file> -R ardalan-jalal/dagwick --bundle <this file>
      - name: Add the provenance to the release files
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          test -s "$BUNDLE"
          cp "$BUNDLE" "release-assets/dagwick-${GITHUB_REF_NAME#v}.intoto.jsonl"
      - uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./release-assets/*.whl ./release-assets/*.tar.gz
          # The release-assets job uploads them, so this job needs no write access.
          release-signing-artifacts: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # A release that is already on PyPI (or a re-run) succeeds without uploading.
          skip-existing: true

  release-assets:
    # Attach the wheel, sdist, their Sigstore bundles and the build provenance to the
    # GitHub release (OpenSSF Scorecard: Signed-Releases). Only this job can write
    # to the repo.
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release-assets/* --clobber -R "$GITHUB_REPOSITORY"
