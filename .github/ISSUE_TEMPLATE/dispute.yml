name: Dispute a check
description: A check gives the wrong result, is too strict, or is weighted wrong.
title: "[Dispute] Rule: <check id>"
labels: ["dispute"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for pushing back on a rule. Disputes are how we keep false alarms out of Dagwick.
        **Do not paste real DAG code, names, data, connection ids, variables or secrets.**
        Write a minimal DAG from scratch that shows the same problem.
  - type: input
    id: rule
    attributes:
      label: Check id
      description: For example `retries`, from the Dagwick tab or `dagwick check --json`.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is wrong?
      options:
        - False alarm (the check is wrong about this DAG)
        - Too strict (right, but the pattern is fine in my setup)
        - Wrong weight (it matters less, or more, than the score says)
        - The fix advice is wrong or unclear
    validations:
      required: true
  - type: dropdown
    id: got
    attributes:
      label: Dagwick says
      description: For a false alarm.
      options: [fail, warn, pass]
  - type: dropdown
    id: expected
    attributes:
      label: It should say
      description: For a false alarm.
      options: [pass, warn, fail, skip]
  - type: textarea
    id: dag
    attributes:
      label: Minimal DAG
      description: >-
        The smallest DAG file that shows it; `dagwick check this_file.py` should reproduce
        a false alarm. Needed for false alarms, helpful for the rest.
      render: python
  - type: textarea
    id: why
    attributes:
      label: Why it is wrong
      description: >-
        What a careful reviewer would say about this code, and how many DAGs in your
        deployment it affects (a rough number).
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: Airflow 3.1.2, Dagwick 0.3.0
    validations:
      required: true
