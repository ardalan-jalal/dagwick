version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /ui
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      # Packages that must move together; separate PRs fail npm ci or the tests.
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    target-branch: dev
    schedule:
      interval: weekly
