[project]
name = "dagwick"
dynamic = ["version"]
description = "The wick that keeps your DAGs lit: DAG quality scores, a fleet view, and fixes you can act on, inside the Airflow 3 UI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "The Dagwick Authors" }]
keywords = ["airflow", "apache-airflow", "airflow-plugin", "dag", "data-quality", "linting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Plugins",
  "Environment :: Web Environment",
  "Framework :: Apache Airflow",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
# Intentionally empty: Dagwick runs inside an existing Airflow 3.1+ installation and
# uses the Airflow (and FastAPI) that is already there. Installing it never pulls in,
# upgrades or downgrades Airflow.
dependencies = []

[project.urls]
Homepage = "https://github.com/dagwick/dagwick"
Repository = "https://github.com/dagwick/dagwick"
Issues = "https://github.com/dagwick/dagwick/issues"
Changelog = "https://github.com/dagwick/dagwick/blob/main/CHANGELOG.md"

[project.scripts]
dagwick = "dagwick.cli:main"

[project.entry-points."airflow.plugins"]
dagwick = "dagwick.plugin:DagwickPlugin"

# Development only (never published as a dependency): tests and the local sandbox.
[dependency-groups]
dev = [
  "apache-airflow==3.3.2",
  "pytest>=8",
  "pytest-cov>=6",
  "ruff>=0.14",
]

[tool.uv]
# Resolve the dev lockfile (Airflow + test tools) for Python 3.11+ only, so it can
# use current, patched versions (e.g. dnspython >= 2.9 needs 3.11). This does not
# change the published package, which has no dependencies and supports 3.10.
environments = ["python_version >= '3.11'"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/dagwick/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dagwick"]

[tool.hatch.build.targets.sdist]
include = [
  "src/dagwick",
  "ui/src",
  "ui/package.json",
  "ui/package-lock.json",
  "ui/tsconfig.json",
  "ui/vite.config.ts",
  "tests",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "SECURITY.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=dagwick --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
branch = true
source = ["dagwick"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
